<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Preview — Ocean</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Ocean</p>
          <h1>Document preview</h1>
          <p class="lede" id="jobHint">Generate a resume to preview it here instantly.</p>
        </div>
        <div class="hero-actions">
          <label class="filter">
            <span>Template</span>
            <select id="templateSelect"></select>
          </label>
          <button type="button" id="printBtn" class="ghost">Print</button>
          <button type="button" id="refreshBtn" class="ghost">Refresh</button>
          <button type="button" id="saveBtn" class="primary" hidden title="Render PDFs and save to the output folder">
            Save PDFs
          </button>
          <button type="button" id="closeBtn" class="ghost">Close</button>
        </div>
      </header>

      <div class="tabs" role="tablist">
        <button type="button" id="tabResume" class="tab is-active" role="tab">Resume</button>
        <button type="button" id="tabCover" class="tab" role="tab">Cover letter</button>
      </div>

      <section id="revisePanel" class="revise-panel" hidden>
        <label class="revise-label" for="revisePrompt">
          Update this resume
          <span class="revise-hint">Sends the current resume JSON + JD + your instructions to GPT</span>
        </label>
        <textarea
          id="revisePrompt"
          rows="3"
          placeholder="e.g. Emphasize nCino and Copado in the most recent role. Shorten the summary to 3 lines."
        ></textarea>
        <div class="revise-actions">
          <button type="button" id="regenerateBtn" class="primary">Regenerate</button>
          <p id="reviseStatus" class="revise-status" hidden></p>
        </div>
      </section>

      <p id="pendingBanner" class="pending-banner" hidden>
        Preview mode — PDFs are not saved yet. Review, optionally regenerate, then click <strong>Save PDFs</strong>.
      </p>
      <section id="atsPreviewBadge" class="ats-preview-badge" hidden title="Final ATS score for the current resume">
        <span class="ats-preview-label">ATS score</span>
        <strong id="atsPreviewValue">—</strong>
        <p id="atsPreviewDetail" class="ats-preview-detail"></p>
      </section>
      <p id="genBanner" class="gen-banner" hidden>Generating resume… preview will update when it is ready.</p>
      <p id="emptyState" class="empty" hidden></p>
      <iframe id="previewFrame" class="preview-frame" title="Document preview"></iframe>
    </div>
    <script type="module" src="preview.js"></script>
  </body>
</html>
