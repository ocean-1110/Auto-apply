<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Resume GPT Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <div class="brand">
        <img src="icons/j-icon.svg" alt="J icon" class="brand-icon" />
        <h1>Resume GPT Builder</h1>
        <p class="hype">LETS GET TEH JOBS!!! 💪</p>
        <button type="button" id="closePanel" class="secondary compact close-btn" title="Close">
          Close
        </button>
      </div>

      <div class="toolbar">
        <label class="field">
          <span>Profile</span>
          <select id="profileSelect"></select>
        </label>
        <label class="field">
          <span>Template</span>
          <select id="templateSelect"></select>
        </label>
        <button type="button" id="deleteProfile" class="secondary danger compact" hidden title="Delete selected profile">
          Delete
        </button>
      </div>

      <section class="section">
        <div class="grid-2">
          <label class="field">
            <span>Job title</span>
            <input id="jobTitle" type="text" placeholder="Senior Software Engineer" autocomplete="off" />
          </label>
          <label class="field">
            <span>Company</span>
            <input id="companyName" type="text" placeholder="Acme Inc." autocomplete="off" />
          </label>
        </div>
        <div class="row-split">
          <label class="field grow">
            <span>JD link</span>
            <input id="jdLink" type="url" placeholder="https://..." autocomplete="off" />
          </label>
          <button type="button" id="copySheetRow" class="secondary compact" title="Copy sheet row">
            Copy row
          </button>
        </div>
      </section>

      <label class="field">
        <span>Job description (JD)</span>
        <textarea
          id="jdText"
          placeholder="Paste the job description here..."
          rows="3"
        ></textarea>
      </label>

      <div class="row">
        <button type="button" id="pasteJd" class="secondary">Paste JD</button>
      </div>

      <div class="row-split">
        <label class="field grow">
          <span>Output folder</span>
          <input
            id="outputDirLabel"
            type="text"
            placeholder="No folder selected"
            autocomplete="off"
            readonly
          />
        </label>
        <button type="button" id="selectOutputDir" class="secondary compact" title="Choose a folder on your PC">
          Select folder
        </button>
      </div>
      <p class="hint">Files save to: selected folder / {job_title}-{company}-{name}/</p>

      <section class="section" id="spreadsheetSection" hidden>
        <label class="field">
          <span>Spreadsheet link</span>
          <input
            id="spreadsheetUrl"
            type="url"
            placeholder="https://docs.google.com/spreadsheets/d/.../edit"
            autocomplete="off"
          />
        </label>
        <div class="row-split">
          <label class="field grow">
            <span>Apps Script Web App URL</span>
            <input
              id="sheetsWebAppUrl"
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              autocomplete="off"
            />
          </label>
          <button type="button" id="copyAppsScript" class="secondary compact">Copy script</button>
        </div>
      </section>

      <div class="row row-2">
        <button type="button" id="generateResume">Generate resume &amp; cover letter</button>
        <button type="button" id="autofillBtn">Autofill</button>
      </div>

      <section class="section ai-qa-section">
        <label class="field">
          <span>Missed form question</span>
          <textarea
            id="manualQuestion"
            placeholder="Paste a question the autofill skipped..."
            rows="3"
          ></textarea>
        </label>
        <div class="row">
          <button type="button" id="generateAiAnswerBtn" class="secondary">
            Get brief AI answer
          </button>
        </div>
        <label class="field">
          <span>AI answer</span>
          <textarea
            id="manualAnswer"
            placeholder="Answer appears here — copy into the form"
            rows="3"
            readonly
          ></textarea>
        </label>
        <div class="row">
          <button type="button" id="copyAiAnswerBtn" class="secondary" disabled>
            Copy answer
          </button>
        </div>
        <p class="hint">Uses JD + resume + profile. 1–2 sentence humanized answer.</p>
      </section>

      <div class="row row-2">
        <button type="button" id="reset" class="secondary">Refresh / Reset</button>
        <button type="button" id="editProfile" class="secondary">Edit profile info</button>
      </div>

      <div class="row">
        <button type="button" id="addProfile" class="secondary">+ Add profile</button>
      </div>

      <section id="saveBanner" class="save-banner" hidden>
        <div class="save-banner-text">
          <strong>Files saved</strong>
          <span id="saveBannerPath"></span>
        </div>
        <button type="button" id="openSavedFolder" class="compact">Open folder</button>
      </section>

      <p id="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
