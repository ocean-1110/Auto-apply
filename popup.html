<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Resume GPT Builder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <div class="brand">
        <img src="icons/j-icon.svg" alt="J icon" class="brand-icon" />
        <h1>Resume GPT Builder</h1>
        <p class="hype">LETS GET TEH JOBS!!! 💪</p>
      </div>

      <div class="toolbar">
        <label class="field">
          <span>Profile</span>
          <select id="profileSelect"></select>
        </label>
        <label class="field">
          <span>Template</span>
          <select id="templateSelect"></select>
        </label>
        <button type="button" id="deleteProfile" class="secondary danger compact" hidden title="Delete selected profile">
          Delete
        </button>
      </div>

      <section class="section">
        <div class="grid-2">
          <label class="field">
            <span>Job title</span>
            <input id="jobTitle" type="text" placeholder="Senior Software Engineer" autocomplete="off" />
          </label>
          <label class="field">
            <span>Company</span>
            <input id="companyName" type="text" placeholder="Acme Inc." autocomplete="off" />
          </label>
        </div>
        <div class="row-split">
          <label class="field grow">
            <span>JD link</span>
            <input id="jdLink" type="url" placeholder="https://..." autocomplete="off" />
          </label>
          <button type="button" id="copySheetRow" class="secondary compact" title="Copy sheet row">
            Copy row
          </button>
        </div>
      </section>

      <label class="field">
        <span>Job description (JD)</span>
        <textarea
          id="jdText"
          placeholder="Paste the job description here..."
          rows="3"
        ></textarea>
      </label>

      <div class="row row-2">
        <button type="button" id="pasteJd" class="secondary">Paste JD</button>
        <button type="button" id="copyPrompt">Generate JSON in ChatGPT</button>
      </div>

      <div class="row-split">
        <label class="field grow">
          <span>Output folder (under Downloads)</span>
          <input
            id="outputDir"
            type="text"
            placeholder="Resume Applications"
            autocomplete="off"
          />
        </label>
      </div>

      <section class="section" id="spreadsheetSection" hidden>
        <label class="field">
          <span>Spreadsheet link</span>
          <input
            id="spreadsheetUrl"
            type="url"
            placeholder="https://docs.google.com/spreadsheets/d/.../edit"
            autocomplete="off"
          />
        </label>
        <div class="row-split">
          <label class="field grow">
            <span>Apps Script Web App URL</span>
            <input
              id="sheetsWebAppUrl"
              type="url"
              placeholder="https://script.google.com/macros/s/.../exec"
              autocomplete="off"
            />
          </label>
          <button type="button" id="copyAppsScript" class="secondary compact">Copy script</button>
        </div>
      </section>

      <label class="field">
        <span>Resume JSON <em class="kbd">Ctrl+Shift+V</em></span>
        <textarea
          id="manualJsonText"
          class="prompt-input"
          placeholder='Paste JSON { ... } — then Ctrl+Enter to render'
          rows="4"
        ></textarea>
      </label>

      <div class="row row-2">
        <button type="button" id="pasteJsonFromClipboard" class="secondary">Paste JSON</button>
        <button type="button" id="saveFromJson">Render resume &amp; cover letter</button>
      </div>

      <div class="row row-2">
        <button type="button" id="reset" class="secondary">Refresh / Reset</button>
        <button type="button" class="panel-toggle secondary" id="toggleAddProfile" aria-expanded="false">
          + Add profile
        </button>
      </div>

      <section class="panel" id="addProfilePanel">
        <div class="panel-body" id="addProfileBody" hidden>
          <label class="field">
            <span>Profile name</span>
            <input id="newProfileName" type="text" placeholder="e.g. Jane Doe" autocomplete="off" />
          </label>
          <label class="field">
            <span>Prompt (must include {JD})</span>
            <textarea
              id="newProfilePrompt"
              class="prompt-input"
              placeholder="Paste the full resume prompt. Include {JD}."
              rows="5"
            ></textarea>
          </label>
          <div class="row">
            <button type="button" id="saveProfile">Save profile</button>
          </div>
        </div>
      </section>

      <p id="status"></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
