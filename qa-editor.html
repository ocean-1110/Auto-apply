<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Q&amp;A bank — Ocean</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="profile-editor.css" />
    <link rel="stylesheet" href="qa-editor.css" />
  </head>
  <body class="editor-page">
    <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-close" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 7l10 10M17 7L7 17"/>
      </symbol>
      <symbol id="i-save" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M6.5 5.5h9.2L18.5 8.3V18.5a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1z"/>
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M8.5 5.5v4.5h7V5.5M8.5 19v-5h7v5"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 6.5v11M6.5 12h11"/>
      </symbol>
      <symbol id="i-export" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 14V4m0 0 3.5 3.5M12 4 8.5 7.5M5 16.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5"/>
      </symbol>
      <symbol id="i-import" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 4v10m0 0-3.5-3.5M12 14l3.5-3.5M5 16.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5"/>
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M10 4h4l1 4H9l1-4zm-2.2 4 .8 10.2A1.6 1.6 0 0 0 10.2 21h3.6a1.6 1.6 0 0 0 1.6-1.8L16.2 8"/>
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M5 6.5h9M5 12h6M5 17.5h5M14 13.5 19.5 8l2 2L16 15.5H14v-2z"/>
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.5 6.5 8.5 12l6 5.5"/>
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9.5 6.5 15.5 12l-6 5.5"/>
      </symbol>
    </svg>

    <main class="editor qa-editor">
      <header class="editor-header">
        <div class="brand">
          <img src="icons/ocean-icon.svg" alt="Ocean" class="brand-icon" />
          <div class="brand-copy">
            <p class="hype">Ocean</p>
            <h1 class="brand-name">Q&amp;A bank</h1>
          </div>
        </div>
      </header>
      <div class="page-back-row">
        <button type="button" id="closeBtn" class="icon-btn" title="Back">
          <svg class="btn-icon" aria-hidden="true"><use href="#i-prev"/></svg>
          <span class="btn-label">Back</span>
        </button>
      </div>

      <p id="status" class="editor-status" role="status"></p>

      <section class="neo-card" id="pendingCard" hidden>
        <div class="qa-list-header">
          <h2 class="section-title">Needs answers</h2>
          <span class="count-chip" id="pendingCount">0</span>
        </div>
        <p class="hint">
          These form fields are not in the bank yet. Register each one, then it will autofill next time.
        </p>
        <div id="pendingList" class="pending-list"></div>
      </section>

      <section class="neo-card">
        <div class="qa-list-header">
          <h2 class="section-title" id="formTitle">Add Q&amp;A</h2>
        </div>
        <p class="hint">
          Matching still works if another site uses a different control for the same question.
        </p>
        <div class="grid-2">
          <label class="field span-2">
            <span>Question</span>
            <textarea id="formQuestion" rows="2" placeholder="e.g. Are you willing to work on-site?"></textarea>
          </label>
          <label class="field span-2">
            <span>Answer</span>
            <textarea
              id="formAnswer"
              rows="3"
              placeholder="For dropdowns, the option text to pick. For checkboxes, Yes or No."
            ></textarea>
          </label>
          <label class="field">
            <span>Field type</span>
            <select id="formFieldType"></select>
          </label>
          <label class="field">
            <span>Save to</span>
            <select id="formScope"></select>
          </label>
        </div>
        <p class="hint" id="formOptionsHint" hidden></p>
        <div class="qa-toolbar">
          <button type="button" id="saveBtn" class="icon-btn icon-btn-accent" title="Save this Q&amp;A">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-save"/></svg>
            <span class="btn-label">Save</span>
          </button>
          <button type="button" id="cancelEditBtn" class="icon-btn" hidden title="Cancel edit">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-close"/></svg>
            <span class="btn-label">Cancel</span>
          </button>
        </div>
      </section>

      <section class="neo-card">
        <div class="qa-list-header">
          <h2 class="section-title">Saved answers</h2>
          <div class="qa-toolbar">
            <button type="button" id="exportBtn" class="icon-btn" title="Export this view as JSON">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-export"/></svg>
              <span class="btn-label">Export</span>
            </button>
            <button type="button" id="importBtn" class="icon-btn" title="Import Q&amp;A from JSON">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-import"/></svg>
              <span class="btn-label">Import</span>
            </button>
            <button type="button" id="clearBtn" class="icon-btn icon-btn-danger" title="Clear this bank">
              <svg class="btn-icon" aria-hidden="true"><use href="#i-trash"/></svg>
              <span class="btn-label">Clear</span>
            </button>
            <input type="file" id="importInput" accept="application/json,.json" hidden />
          </div>
        </div>
        <div class="grid-2 browse-filters">
          <label class="field">
            <span>Show answers for</span>
            <select id="filterProfile"></select>
          </label>
          <label class="field">
            <span>Field type</span>
            <select id="filterType">
              <option value="">All types</option>
            </select>
          </label>
          <label class="field span-2">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Filter by question or answer" />
          </label>
        </div>
        <div class="pager-meta">
          <p class="hint" id="countHint">0 saved</p>
          <label class="page-size-field">
            <span>Per page</span>
            <select id="pageSizeSelect">
              <option value="8">8</option>
              <option value="12" selected>12</option>
              <option value="24">24</option>
            </select>
          </label>
        </div>
        <div class="qa-list qa-editor-list" id="qaList" aria-label="Saved questions and answers"></div>
        <nav class="pager" id="pager" hidden aria-label="Saved answers pages">
          <button type="button" id="pagePrev" class="pager-btn" title="Previous page">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-prev"/></svg>
          </button>
          <div class="pager-pages" id="pagerPages"></div>
          <button type="button" id="pageNext" class="pager-btn" title="Next page">
            <svg class="btn-icon" aria-hidden="true"><use href="#i-next"/></svg>
          </button>
        </nav>
      </section>
    </main>
    <script type="module" src="qa-editor.js"></script>
  </body>
</html>
